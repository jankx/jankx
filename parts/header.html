<!--
  Gutenberg Header Block Template
  Supports: site title, logo, navigation, search, custom HTML
  Theme: Light & Dark
-->
<header class="jankx-header {{ theme }}">
  <div class="jankx-header-inner">
    <div class="jankx-header-left">
      <!-- Site Logo -->
      <div class="jankx-site-logo">
        <!-- wp:site-logo /-->
      </div>
      <!-- Site Title -->
      <div class="jankx-site-title">
        <!-- wp:site-title /-->
      </div>
    </div>
    <div class="jankx-header-center">
      <!-- Navigation -->
      <nav class="jankx-site-navigation">
        <!-- wp:navigation {"menuSlug":"primary"} /-->
      </nav>
    </div>
    <div class="jankx-header-right">
      <!-- Search -->
      <div class="jankx-site-search">
        <!-- wp:search {"label":"Search..."} /-->
      </div>
      <!-- Custom HTML (optional) -->
      <div class="jankx-header-custom-html">
        <!-- Custom content here -->
      </div>
    </div>
  </div>
</header>
